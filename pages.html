<script>
  // ═══════════════════════════════════════════════════════════════
  // CONFIGURATION DYNAMIQUE DE LA PAGE DE CONNEXION
  // ═══════════════════════════════════════════════════════════════
  
  document.addEventListener('DOMContentLoaded', function() {
    // Vérifier si settings.js est chargé
    if (typeof pageLoginConfig !== 'undefined') {
      
      // 1️⃣ Favicon (icône de l'onglet)
      const faviconLink = document.getElementById('faviconLink');
      if (faviconLink && pageLoginConfig.favicon) {
        faviconLink.href = pageLoginConfig.favicon;
      }
      
      // 2️⃣ Logo Mobile (header)
      const logoMobile = document.getElementById('logoMobile');
      if (logoMobile && pageLoginConfig.logoMobile) {
        logoMobile.src = pageLoginConfig.logoMobile;
        if (pageLoginConfig.logoMobileWidth) {
          logoMobile.width = parseInt(pageLoginConfig.logoMobileWidth);
        }
      }
      
      // 3️⃣ Logo Desktop (header)
      const logoDesktop = document.getElementById('logoDesktop');
      if (logoDesktop && pageLoginConfig.logoDesktop) {
        logoDesktop.src = pageLoginConfig.logoDesktop;
        if (pageLoginConfig.logoDesktopWidth) {
          logoDesktop.width = parseInt(pageLoginConfig.logoDesktopWidth);
        }
      }
      
      // 4️⃣ Image de fond côté droit (desktop uniquement)
      const imageFond = document.getElementById('imageFondDesktop');
      if (imageFond && pageLoginConfig.imageFondUrl) {
        imageFond.style.backgroundImage = `url('${pageLoginConfig.imageFondUrl}')`;
      }
      
      // 5️⃣ Couleur du bouton "Valider"
      const boutonValider = document.getElementById('boutonValider');
      if (boutonValider && pageLoginConfig.couleurBoutonValider) {
        boutonValider.style.backgroundColor = pageLoginConfig.couleurBoutonValider;
      }
    }
  });
</script>
